# 로컬 개발 스택. Qdrant 만 컨테이너로 띄우고 API 는 호스트에서 실행한다.
# (API 를 컨테이너에 넣으면 코드 수정마다 재빌드가 필요해 개발이 느려진다)
#
#   docker compose up -d
#
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: chest-ai-qdrant
    ports:
      - "6333:6333"   # HTTP / 웹 UI
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant_server:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
